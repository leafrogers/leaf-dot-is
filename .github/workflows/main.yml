name: Deploy main to Fly.io
on:
  push:
    branches:
      - main
permissions:
  contents: read
  statuses: read
  checks: read
concurrency:
  group: deploy-main
  cancel-in-progress: true
jobs:
  deploy:
    name: Deploy app after tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.10.0'
      - name: Require CircleCI success for this commit
        timeout-minutes: 25
        run: node scripts/wait-for-circleci.js
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --app "$FLY_APP_NAME" --build-arg NODE_ENV=production --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP_NAME: ${{ secrets.FLY_APP_NAME }}

