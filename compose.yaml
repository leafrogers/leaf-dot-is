services:
  server:
    build:
      context: .
    environment:
      NODE_ENV: production
      PG_CONNECTION_STRING: ${PG_CONNECTION_STRING}
      BASE_URL: ${BASE_URL}
      PERMALINK_BASE_URL: ${PERMALINK_BASE_URL}
      PRISMIC_ACCESS_TOKEN: ${PRISMIC_ACCESS_TOKEN}
      PRISMIC_TYPES_TOKEN: ${PRISMIC_TYPES_TOKEN}
      PRISMIC_REPO_NAME: ${PRISMIC_REPO_NAME}
    ports:
      - 3001:3001
